name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run test:ci
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm run build
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser controls, jobs, rendering and responsive layout
        shell: bash
        run: |
          node tools/serve.cjs > /tmp/dead-slow-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:8080/dist/ > /dev/null && break
            sleep 0.1
          done
          python tests/browser_smoke.py --url http://127.0.0.1:8080/dist/ --report reports/browser.json
      - name: World 4 controls, presentation and wheel audio
        run: python tests/browser_rampage.py

      - name: Accelerated tour controls and revised approaches
        run: python tests/browser_readiness.py

      - name: Restart safety, eight-world atlas and volcanic crossings
        run: python tests/browser_release_atlas.py

      - name: Keep browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-review
          path: reports/
          retention-days: 7
